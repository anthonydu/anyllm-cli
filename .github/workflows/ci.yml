name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck bin/anyllm

  audit:
    name: Audit Homebrew Formula
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Audit Formula
        run: |
          brew tap-new local/tap
          cp Formula/anyllm-cli.rb $(brew --repository local/tap)/Formula/anyllm-cli.rb
          brew audit --strict local/tap/anyllm-cli

  test:
    name: Run Automated Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install kcov
        run: sudo apt-get update && sudo apt-get install -y kcov

      - name: Set ptrace scope
        run: sudo sysctl kernel.yama.ptrace_scope=0

      - name: Run Tests with Coverage
        run: |
          chmod +x tests/run_tests.sh
          kcov --include-path=bin/anyllm coverage_dir ./tests/run_tests.sh

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: coverage_dir
          fail_ci_if_error: false
